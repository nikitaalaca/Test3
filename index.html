<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4B6BFF">
    <title>Connecta</title>
    <style>
        :root {
            --primary: #4B6BFF;
            --primary-rgb: 75, 107, 255;
            --bg-main: #FFFFFF;
            --bg-secondary: #F5F6FA;
            --text-primary: #1A1D26;
            --text-secondary: #A0A3BD;
            --text-tertiary: #6B7280;
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #F59E0B;
            --border-color: #F0F1F5;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        
        body, html {
            width: 100%;
            height: 100dvh;
            background: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.4s var(--transition-smooth) forwards;
        }
        
        .fade-in-scale {
            animation: fadeInScale 0.3s var(--transition-smooth) forwards;
        }
        
        /* Main Layout */
        #app-layout {
            display: flex;
            width: 100vw;
            height: 100dvh;
            position: relative;
            z-index: 2;
            overflow: hidden;
            background: var(--bg-main);
        }
        
        #sidebar-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            position: relative;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #main-chat-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
            background: var(--bg-main);
        }
        
        @media (min-width: 769px) {
            #sidebar-container {
                width: 400px;
                border-right: 1px solid var(--border-color);
            }
        }
        
        @media (max-width: 768px) {
            #sidebar-container {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 10;
            }
            #main-chat-container {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 20;
                transform: translate3d(100%, 0, 0);
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .chat-opened-mobile #sidebar-container {
                transform: translate3d(-30%, 0, 0);
            }
            .chat-opened-mobile #main-chat-container {
                transform: translate3d(0, 0, 0);
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08);
            }
        }
        
        /* Header */
        .app-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-main);
            border-bottom: 1px solid transparent;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        
        .header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform var(--transition-fast);
            border: 2px solid var(--border-color);
        }
        
        .header-avatar:active {
            transform: scale(0.95);
        }
        
        .header-greeting {
            min-width: 0;
        }
        
        .greeting-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        .greeting-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .header-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            position: relative;
            flex-shrink: 0;
        }
        
        .header-icon-btn:active {
            transform: scale(0.93);
            background: #EBECF0;
        }
        
        .header-icon-btn svg {
            width: 22px;
            height: 22px;
        }
        
        .notification-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid var(--bg-main);
        }
        
        /* Search Bar */
        .search-container {
            padding: 8px 20px 12px;
            position: sticky;
            top: 76px;
            z-index: 99;
            background: var(--bg-main);
        }
        
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 0 16px;
            height: 48px;
            transition: all var(--transition-fast);
            border: 2px solid transparent;
        }
        
        .search-bar:focus-within {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
        }
        
        .search-icon {
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-right: 12px;
        }
        
        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 400;
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        /* Stories */
        .stories-section {
            padding: 4px 20px 16px;
        }
        
        .stories-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0;
        }
        
        .stories-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform var(--transition-fast);
        }
        
        .story-item:active {
            transform: scale(0.95);
        }
        
        .story-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            padding: 3px;
            position: relative;
            transition: all var(--transition-fast);
        }
        
        .story-ring.has-story {
            background: linear-gradient(135deg, #4B6BFF, #7C5CFC);
        }
        
        .story-ring.viewed {
            background: #E5E7EB;
        }
        
        .story-ring.my-story {
            background: #E5E7EB;
        }
        
        .story-ring.my-story.has-story {
            background: linear-gradient(135deg, #4B6BFF, #7C5CFC);
        }
        
        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
        }
        
        .story-add-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #FFFFFF;
            z-index: 2;
            box-shadow: var(--shadow-sm);
        }
        
        .story-name {
            font-size: 12px;
            color: var(--text-secondary);
            max-width: 64px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        
        /* Tab Bar */
        .tab-bar-modern {
            display: flex;
            gap: 4px;
            padding: 0 20px 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .tab-btn-modern {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            letter-spacing: -0.2px;
        }
        
        .tab-btn-modern.active {
            color: var(--primary);
        }
        
        .tab-btn-modern::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
            transition: width var(--transition-fast);
        }
        
        .tab-btn-modern.active::after {
            width: 24px;
        }
        
        .tab-badge {
            position: absolute;
            top: 2px;
            right: -4px;
            min-width: 18px;
            height: 18px;
            background: var(--danger);
            color: white;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }
        
        /* Chat List */
        .scroller-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0 100px;
            display: none;
            -webkit-overflow-scrolling: touch;
        }
        
        .scroller-content.active {
            display: block;
            animation: fadeInUp 0.3s var(--transition-smooth);
        }
        
        .chat-list-item {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            animation: fadeInUp 0.4s var(--transition-smooth) both;
        }
        
        .chat-list-item:active {
            background: var(--bg-secondary);
            transform: scale(0.98);
        }
        
        .chat-list-item.active {
            background: rgba(var(--primary-rgb), 0.05);
        }
        
        .chat-list-item.pinned {
            background: rgba(var(--primary-rgb), 0.03);
        }
        
        .chat-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        
        .chat-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            transition: transform var(--transition-fast);
        }
        
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--success);
            border: 3px solid var(--bg-main);
            border-radius: 50%;
        }
        
        .unread-count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            background: var(--primary);
            color: white;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            border: 2px solid var(--bg-main);
            box-shadow: var(--shadow-sm);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        
        .chat-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .verified-icon {
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .pin-icon-small {
            color: var(--primary);
            font-size: 13px;
            flex-shrink: 0;
        }
        
        .chat-time {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            flex-shrink: 0;
            margin-left: 8px;
        }
        
        .chat-preview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-preview {
            font-size: 15px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
            line-height: 1.3;
        }
        
        .typing-indicator {
            color: var(--success);
            font-style: italic;
            font-weight: 500;
        }
        
        .message-status {
            display: inline-flex;
            gap: 2px;
            margin-left: 4px;
        }
        
        .message-status svg {
            width: 14px;
            height: 14px;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 70px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            transition: all var(--transition-fast);
            position: relative;
        }
        
        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: all var(--transition-fast);
        }
        
        .nav-item span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
        }
        
        .nav-item.active svg {
            color: var(--primary);
        }
        
        .nav-item.active span {
            color: var(--primary);
        }
        
        .nav-fab {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(var(--primary-rgb), 0.4);
            transition: all var(--transition-fast);
            margin-top: -24px;
        }
        
        .nav-fab:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(var(--primary-rgb), 0.3);
        }
        
        .nav-fab svg {
            width: 24px;
            height: 24px;
            color: white;
        }
        
        /* Existing styles preservation */
        .msg-container.outgoing { animation: slideInRight 0.3s ease; }
        .msg-container.incoming { animation: slideInLeft 0.3s ease; }
        
        /* Utility classes */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Lightbox, loading overlay, etc. (keep existing modals) -->
    <div id="toast-container"></div>
    <div id="lightbox" onclick="this.classList.remove('active')"><img id="lightbox-img" src="" alt="Фото"></div>
    <div id="loading-overlay" class="modal-overlay"><div style="display:flex; flex-direction:column; align-items:center; gap:16px;"><div class="spinner"></div><div style="color:white; font-weight:600;">Загрузка...</div></div></div>
    
    <!-- Story Viewer (keep existing) -->
    <div id="story-viewer" class="story-viewer">
        <div class="story-viewer-header">
            <div class="story-viewer-avatar" id="story-viewer-avatar"></div>
            <div class="story-viewer-info">
                <div class="story-viewer-name" id="story-viewer-name"></div>
                <div class="story-viewer-time" id="story-viewer-time"></div>
            </div>
        </div>
        <div class="story-progress-bar" id="story-progress-bar"></div>
        <div class="story-content" id="story-content">
            <div class="story-nav story-nav-left" id="story-nav-left"></div>
            <div class="story-nav story-nav-right" id="story-nav-right"></div>
        </div>
        <button class="story-close-btn" onclick="closeStoryViewer()">X</button>
    </div>
    
    <!-- Attachment Menu (keep existing) -->
    <div class="attachment-menu-overlay" id="attachment-menu" onclick="closeAttachmentMenu()">
        <div class="attachment-menu" onclick="event.stopPropagation()">
            <div class="attachment-menu-grid">
                <div class="attachment-menu-item" onclick="openFilePicker('image/*', 'Фото или видео')">
                    <div class="attachment-menu-icon" style="background: rgba(75,107,255,0.1); color: #4B6BFF;">🖼</div>
                    <div class="attachment-menu-label">Фото или видео</div>
                </div>
                <div class="attachment-menu-item" onclick="openFilePicker('*', 'Файл')">
                    <div class="attachment-menu-icon" style="background: rgba(34,197,94,0.1); color: #22C55E;">📄</div>
                    <div class="attachment-menu-label">Файл</div>
                </div>
                <div class="attachment-menu-item" onclick="openCamera()">
                    <div class="attachment-menu-icon" style="background: rgba(245,158,11,0.1); color: #F59E0B;">📷</div>
                    <div class="attachment-menu-label">Камера</div>
                </div>
                <div class="attachment-menu-item" onclick="startVoiceRecord()">
                    <div class="attachment-menu-icon" style="background: rgba(124,92,252,0.1); color: #7C5CFC;">🎤</div>
                    <div class="attachment-menu-label">Голосовое</div>
                </div>
                <div class="attachment-menu-item" onclick="openPollModal()">
                    <div class="attachment-menu-icon" style="background: rgba(239,68,68,0.1); color: #EF4444;">📊</div>
                    <div class="attachment-menu-label">Опрос</div>
                </div>
                <div class="attachment-menu-item" onclick="shareLocation()">
                    <div class="attachment-menu-icon" style="background: rgba(75,107,255,0.1); color: #4B6BFF;">📍</div>
                    <div class="attachment-menu-label">Геопозиция</div>
                </div>
            </div>
            <button class="attachment-menu-cancel" onclick="closeAttachmentMenu()">Отмена</button>
        </div>
    </div>
    
    <!-- Auth Modal (keep existing) -->
    <div id="auth-modal" class="modal-overlay active" style="z-index: 9998;"><div class="modal-card" id="auth-card-content"><h3 style="text-align:center;">Загрузка...</h3></div></div>
    
    <!-- Other modals (keep existing) -->
    
    <div id="app-layout">
        <aside id="sidebar-container">
            <!-- New Modern Header -->
            <header class="app-header">
                <div class="header-left">
                    <div class="header-avatar" id="header-avatar" onclick="openProfileModal()" style="background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
                        <!-- Avatar will be set dynamically -->
                    </div>
                    <div class="header-greeting">
                        <div class="greeting-label">Добро пожаловать</div>
                        <div class="greeting-name" id="header-name">Пользователь</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-icon-btn" id="notification-btn" onclick="openAppSettings()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <div class="notification-badge" id="notif-dot"></div>
                    </button>
                    <button class="header-icon-btn" onclick="openCreateGroupModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="19" y1="8" x2="19" y2="14"/>
                            <line x1="22" y1="11" x2="16" y2="11"/>
                        </svg>
                    </button>
                </div>
            </header>
            
            <!-- Modern Search Bar -->
            <div class="search-container">
                <div class="search-bar">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Поиск...">
                </div>
            </div>
            
            <!-- Modern Stories Section -->
            <div class="stories-section">
                <div class="stories-scroll" id="stories-bar">
                    <!-- Stories rendered dynamically -->
                </div>
            </div>
            
            <!-- Modern Tab Bar -->
            <nav class="tab-bar-modern">
                <button class="tab-btn-modern active" id="tab-chats" onclick="switchTab('chats')">
                    Чаты
                    <span class="tab-badge" id="chats-badge" style="display:none;">0</span>
                </button>
                <button class="tab-btn-modern" id="tab-groups" onclick="switchTab('groups')">
                    Команды
                    <span class="tab-badge" id="groups-badge" style="display:none;">0</span>
                </button>
                <button class="tab-btn-modern" id="tab-contacts" onclick="switchTab('contacts')">
                    Люди
                </button>
            </nav>
            
            <!-- Chat Lists -->
            <div id="content-chats" class="scroller-content active"></div>
            <div id="content-groups" class="scroller-content"></div>
            <div id="content-contacts" class="scroller-content"></div>
            
            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <button class="nav-item active" onclick="switchTab('chats')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Чаты</span>
                </button>
                <button class="nav-item" onclick="switchTab('groups')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Команды</span>
                </button>
                <button class="nav-fab" onclick="openCreateGroupModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
                <button class="nav-item" onclick="openAppSettings()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>Ещё</span>
                </button>
            </div>
        </aside>
        <main id="main-chat-container">
            <!-- Chat subsystem (keep existing) -->
            <div id="chat-subsystem" style="display:none; flex-direction:column; height:100%;">
                <!-- Chat header, messages, input bar (keep existing) -->
            </div>
            <div id="empty-stub" class="empty-state">
                <svg width="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <h3 style="font-weight:600; color:var(--text-secondary);">Выберите диалог</h3>
                <p style="color:var(--text-secondary); font-size:14px;">Начните общение с коллегами</p>
            </div>
        </main>
    </div>
    
    <!-- Keep all existing scripts and Firebase initialization -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        // ============ Keep all existing JavaScript logic exactly the same ============
        // Only modify the render functions to use new CSS classes
        
        // ... [Keep all existing Firebase config, variables, and functions exactly as before] ...
        
        // Modified render functions to use new classes:
        
        function renderLists() {
            const searchEl = document.getElementById('search-input');
            const search = searchEl ? searchEl.value.toLowerCase() : '';
            
            // Update header avatar and name
            const me = allUsers.find(u => u.id === currentUserId);
            if (me) {
                const headerAvatar = document.getElementById('header-avatar');
                const headerName = document.getElementById('header-name');
                if (headerAvatar && me.img) {
                    headerAvatar.style.backgroundImage = `url('${me.img}')`;
                    headerAvatar.style.backgroundSize = 'cover';
                    headerAvatar.textContent = '';
                } else if (headerAvatar) {
                    headerAvatar.style.background = me.color || 'var(--primary)';
                    headerAvatar.textContent = (me.name || 'П').substring(0, 1).toUpperCase();
                }
                if (headerName) {
                    headerName.textContent = me.name || 'Пользователь';
                }
            }
            
            // Contacts list
            const contactsContainer = document.getElementById('content-contacts');
            if (contactsContainer && activeTab === 'contacts') {
                contactsContainer.innerHTML = '';
                const fragC = document.createDocumentFragment();
                allUsers.filter(u => u.id !== currentUserId && (!search || u.name.toLowerCase().includes(search)))
                    .forEach((u, index) => {
                        const div = document.createElement('div');
                        div.className = `chat-list-item ${activeChatId === u.id && !isGroupMode ? 'active' : ''}`;
                        div.style.animationDelay = `${index * 0.05}s`;
                        div.onclick = () => openChat(u.id, false);
                        
                        const avatarHtml = getAvatarModern(u, 56);
                        const verifiedIcon = isVerified(u.id) ? '<span class="verified-icon">✓</span>' : '';
                        const onlineDot = u.status === 'в сети' ? '<div class="online-dot"></div>' : '';
                        
                        div.innerHTML = `
                            <div class="chat-avatar-wrapper">
                                ${avatarHtml}
                                ${onlineDot}
                            </div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <div class="chat-name">${escapeHTML(u.name)}${verifiedIcon}</div>
                                </div>
                                <div class="chat-preview-row">
                                    <div class="chat-preview">${escapeHTML(u.statusText || getStatusPlainText(u.status))}</div>
                                </div>
                            </div>
                        `;
                        fragC.appendChild(div);
                    });
                contactsContainer.appendChild(fragC);
            }
            
            // Groups list
            const groupsContainer = document.getElementById('content-groups');
            if (groupsContainer && activeTab === 'groups') {
                groupsContainer.innerHTML = '';
                const fragG = document.createDocumentFragment();
                allGroups.filter(g => g.members && g.members[currentUserId] && (!search || g.name.toLowerCase().includes(search)))
                    .forEach((g, index) => {
                        const div = document.createElement('div');
                        div.className = `chat-list-item ${activeChatId === g.id && isGroupMode ? 'active' : ''}`;
                        div.style.animationDelay = `${index * 0.05}s`;
                        div.onclick = () => openChat(g.id, true);
                        
                        const chat = myChats[g.id];
                        const lastMsg = chat ? chat.lastMsg : '';
                        const lastTime = chat ? chat.time : '';
                        const senderName = chat && chat.senderName ? chat.senderName : '';
                        const prefix = senderName ? `<span style="color:var(--primary);font-weight:500;">${escapeHTML(senderName)}:</span> ` : '';
                        const unreadCount = chat && chat.unread && chat.senderUid !== currentUserId ? chat.unread : 0;
                        
                        div.innerHTML = `
                            <div class="chat-avatar-wrapper">
                                ${getAvatarModern(g, 56)}
                                ${unreadCount > 0 ? `<div class="unread-count">${unreadCount > 99 ? '99+' : unreadCount}</div>` : ''}
                            </div>
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <div class="chat-name">${escapeHTML(g.name)}</div>
                                    <div class="chat-time">${escapeHTML(lastTime)}</div>
                                </div>
                                <div class="chat-preview-row">
                                    <div class="chat-preview">${prefix}${escapeHTML(lastMsg)}</div>
                                </div>
                            </div>
                        `;
                        fragG.appendChild(div);
                    });
                groupsContainer.appendChild(fragG);
            }
            
            // Chats list
            const chatsContainer = document.getElementById('content-chats');
            if (chatsContainer && activeTab === 'chats') {
                chatsContainer.innerHTML = '';
                let chatArr = [];
                
                for (let key in myChats) {
                    const meta = myChats[key];
                    if (meta.isG) {
                        const g = allGroups.find(x => x.id === key);
                        if (g && (!search || g.name.toLowerCase().includes(search))) {
                            chatArr.push({id: key, isG: true, obj: g, last: meta, realKey: key});
                        }
                    } else {
                        let otherId = key.replace(currentUserId, '').replace(/^_|_$/g, '');
                        if (!otherId) otherId = currentUserId;
                        let u = allUsers.find(x => x.id === otherId);
                        if (!u) u = {id: otherId, name: 'Удаленный', status: ''};
                        if (!search || u.name.toLowerCase().includes(search)) {
                            chatArr.push({id: otherId, isG: false, obj: u, last: meta, realKey: key});
                        }
                    }
                }
                
                chatArr.sort((a, b) => {
                    if (pinnedChats.has(a.realKey) && !pinnedChats.has(b.realKey)) return -1;
                    if (!pinnedChats.has(a.realKey) && pinnedChats.has(b.realKey)) return 1;
                    return b.last.ts - a.last.ts;
                });
                
                if (chatArr.length === 0) {
                    chatsContainer.innerHTML = '<div class="empty-state" style="padding:40px;text-align:center;color:var(--text-secondary);">Нет диалогов</div>';
                    return;
                }
                
                const fragChats = document.createDocumentFragment();
                chatArr.forEach((c, index) => {
                    const div = document.createElement('div');
                    div.className = `chat-list-item ${activeChatId === c.id && isGroupMode === c.isG ? 'active' : ''} ${pinnedChats.has(c.realKey) ? 'pinned' : ''}`;
                    div.style.animationDelay = `${index * 0.05}s`;
                    div.onclick = () => openChat(c.id, c.isG, c.realKey);
                    
                    const onlineDot = !c.isG && c.obj.status === 'в сети' ? '<div class="online-dot"></div>' : '';
                    const prefix = c.isG && c.last.senderName ? `<span style="color:var(--primary);font-weight:500;">${escapeHTML(c.last.senderName)}:</span> ` : '';
                    const unreadCount = c.last.unread && c.last.senderUid !== currentUserId ? c.last.unread : 0;
                    const checksHTML = !c.isG && c.last.senderUid === currentUserId ? getMessageChecks(c.last.msgStatus || 'sent') : '';
                    const verifiedIcon = !c.isG && isVerified(c.obj.id) ? '<span class="verified-icon">✓</span>' : '';
                    const pinIcon = pinnedChats.has(c.realKey) ? '<span class="pin-icon-small">📌</span>' : '';
                    
                    div.innerHTML = `
                        <div class="chat-avatar-wrapper">
                            ${getAvatarModern(c.obj, 56)}
                            ${onlineDot}
                            ${unreadCount > 0 ? `<div class="unread-count">${unreadCount > 99 ? '99+' : unreadCount}</div>` : ''}
                        </div>
                        <div class="chat-info">
                            <div class="chat-header-row">
                                <div class="chat-name">${pinIcon}${escapeHTML(c.obj.name)}${verifiedIcon}</div>
                                <div class="chat-time">${escapeHTML(c.last.time || '')}</div>
                            </div>
                            <div class="chat-preview-row">
                                <div class="chat-preview">${prefix}${escapeHTML(c.last.lastMsg || '')}${checksHTML}</div>
                            </div>
                        </div>
                    `;
                    fragChats.appendChild(div);
                });
                chatsContainer.appendChild(fragChats);
            }
            
            updateTabBadges();
        }
        
        function getAvatarModern(obj, size = 56) {
            if (!obj) return `<div class="chat-avatar" style="width:${size}px;height:${size}px;background:var(--primary);">?</div>`;
            const st = `width:${size}px;height:${size}px;`;
            let bgStyle = '';
            if (obj.img && String(obj.img).trim() && String(obj.img).match(/^data:image\/(png|jpeg|jpg|gif|webp);base64,/)) {
                let safeUrl = String(obj.img).replace(/"/g, '&quot;');
                bgStyle = `background-image: url('${safeUrl}'); background-size: cover; background-position: center;`;
            } else {
                const safeColor = obj.color ? obj.color.replace(/[^#a-fA-F0-9]/g, '') : 'var(--primary)';
                bgStyle = `background: ${safeColor};`;
            }
            const init = escapeHTML((obj.name || 'ГР').substring(0, 2).toUpperCase());
            const hasBgImg = bgStyle.includes('background-image');
            return `<div class="chat-avatar" style="${bgStyle} ${st}">${hasBgImg ? '' : init}</div>`;
        }
        
        function getMessageChecks(status) {
            if (status === 'sent') return '<span class="message-status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span>';
            if (status === 'delivered') return '<span class="message-status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span>';
            if (status === 'read') return '<span class="message-status" style="color:var(--primary);"><svg viewBox="0 0 24 24" fill="currentColor"><polyline points="20 6 9 17 4 12"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><polyline points="20 6 9 17 4 12"/></svg></span>';
            return '';
        }
        
        function updateTabBadges() {
            let chatsUnread = 0, groupsUnread = 0;
            for (let key in myChats) {
                const chat = myChats[key];
                if (chat.unread && chat.senderUid !== currentUserId) {
                    if (chat.isG) groupsUnread += chat.unread;
                    else chatsUnread += chat.unread;
                }
            }
            updateBadge('chats-badge', chatsUnread);
            updateBadge('groups-badge', groupsUnread);
            
            // Update notification dot
            const notifDot = document.getElementById('notif-dot');
            if (notifDot) {
                if (chatsUnread + groupsUnread > 0) {
                    notifDot.style.display = 'block';
                } else {
                    notifDot.style.display = 'none';
                }
            }
        }
        
        function updateBadge(id, count) {
            const badge = document.getElementById(id);
            if (!badge) return;
            if (count > 0) {
                badge.style.display = 'flex';
                badge.textContent = count > 99 ? '99+' : count;
            } else {
                badge.style.display = 'none';
            }
        }
        
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn-modern').forEach(b => b.classList.remove('active'));
            const tabBtn = document.getElementById('tab-' + tab);
            if (tabBtn) tabBtn.classList.add('active');
            
            // Update bottom nav
            document.querySelectorAll('.nav-item').forEach((item, index) => {
                item.classList.remove('active');
                if ((tab === 'chats' && index === 0) || (tab === 'groups' && index === 1)) {
                    item.classList.add('active');
                }
            });
            
            document.querySelectorAll('.scroller-content').forEach(c => c.classList.remove('active'));
            const content = document.getElementById('content-' + tab);
            if (content) content.classList.add('active');
            renderLists();
        }
        
        // ... [Keep ALL other existing functions exactly the same] ...
        
    </script>
</body>
</html>
