/* ---------- авторизация ---------- */
const ER={'auth/invalid-credential':'Неверный email или пароль','auth/wrong-password':'Неверный пароль','auth/user-not-found':'Пользователь не найден','auth/email-already-in-use':'Email уже занят','auth/weak-password':'Пароль — минимум 6 символов','auth/invalid-email':'Некорректный email','auth/network-request-failed':'Нет сети'};
function authUI(reg){$('#au').classList.remove('off');$('#au .card').innerHTML=`<h3>${reg?'Регистрация':'Connecta'}</h3>${reg?'<input id=an class=in placeholder="Имя">':''}<input id=ae class=in type=email placeholder=Email autocomplete=email><input id=aw class=in type=password placeholder=Пароль autocomplete=${reg?'new-password':'current-password'}><button class=pb onclick="doAuth(${reg})">${reg?'Создать аккаунт':'Войти'}</button><button class="pb sc" onclick="authUI(${!reg})">${reg?'Уже есть аккаунт':'Создать аккаунт'}</button>`}
async function doAuth(reg){const e=$('#ae').value.trim(),p=$('#aw').value,n=reg?$('#an').value.trim():'';if(!e||!p||(reg&&!n))return toast('Заполните все поля');
try{if(reg){const c=await auth.createUserWithEmailAndPassword(e,p);await db.ref('users/'+c.user.uid).set({id:c.user.uid,name:n,email:e,status:'в сети',description:'',statusText:''})}else await auth.signInWithEmailAndPassword(e,p)}catch(x){toast('Ошибка',ER[x.code]||x.message)}}
$('#au').onkeydown=e=>{if(e.key==='Enter')$('#au .pb').click()};
function logout(){db.ref('users/'+U+'/status').set(SV.TIMESTAMP).catch(()=>{}).then(()=>auth.signOut()).then(()=>location.reload())}
auth.onAuthStateChanged(u=>{if(u){U=u.uid;$('#au').classList.add('off');init()}else{U=null;authUI(0)}});

/* ---------- ядро ---------- */
function init(){if(boot)return;boot=1;
db.ref('users').on('value',s=>{USERS=s.val()||{};if(!USERS[U]&&auth.currentUser)db.ref('users/'+U).set({id:U,name:(auth.currentUser.email||'User').split('@')[0],email:auth.currentUser.email||'',status:'в сети',description:'',statusText:''});draw()});
db.ref('groups').on('value',s=>{GR=s.val()||{};draw()});
db.ref('stories').on('value',s=>{ST=s.val()||{};drawStories()});
db.ref('user_chats/'+U).on('value',s=>{const n=s.val()||{};if(boot===2)for(const k in n){const c=n[k],o=MY[k];if(c.ts>(o?o.ts:0)&&c.senderUid!==U&&c.senderUid!=='system'&&(!CH||CH.key!==k||document.hidden)){beep();toast(c.senderName||'Сообщение',c.lastMsg);if(document.hidden&&window.Notification&&Notification.permission==='granted')try{new Notification(c.senderName||'Connecta',{body:c.lastMsg})}catch{}}}boot=2;MY=n;draw()});
db.ref('.info/connected').on('value',s=>{if(s.val()){const r=db.ref('users/'+U+'/status');r.onDisconnect().set(SV.TIMESTAMP).then(()=>r.set('в сети'))}else if(boot===2)toast('Нет соединения')});
setTimeout(()=>{const o=ST[U]||{};for(const k in o)if(o[k]&&o[k].time<Date.now()-DAY)db.ref(`stories/${U}/${k}`).remove()},5000)}
let dq;function draw(){cancelAnimationFrame(dq);dq=requestAnimationFrame(()=>{drawHead();drawList();chatHead()})}
function drawHead(){const u=me();$('#hav').innerHTML=av(u,40);$('#hn').textContent=u.name;let n=0;for(const k in MY)n+=+MY[k].unread||0;document.title=(n?`(${n}) `:'')+'Connecta'}

/* ---------- списки ---------- */
function row({o,m,g,id,k}){const on=CH&&CH.id===id&&CH.g==g;let sub,t='',ub='';
if(m){const mine=m.senderUid===U;sub=(g&&m.senderName&&m.senderUid!=='system'?`<s>${esc(mine?'Вы':m.senderName)}:</s> `:'')+esc(m.lastMsg||'');t=m.time||'';if(m.unread>0)ub=`<u class=ub>${m.unread>99?'99+':m.unread}</u>`;else if(mine&&!g)sub=tk(m.msgStatus)+sub}else sub=esc(o.statusText||stt(o));
return `<div class="row${on?' on':''}" data-id="${id}" data-g="${g}"${k?` data-k="${k}"`:''}><div style="position:relative">${av(o)}${!g&&o.status==='в сети'?'<i class=dot></i>':''}</div><div class=rm><div class=r1><b>${PIN.has(k)?'📌 ':''}${esc(o.name)}${g?'':vb(id)}</b><small>${esc(t)}</small></div><div class=r2><span>${sub}</span>${ub}</div></div></div>`}
function drawList(){const q=$('#q').value.trim().toLowerCase(),mt=n=>!q||String(n).toLowerCase().includes(q);let h='';
if(TAB===0){const a=[];for(const k in MY){const m=MY[k];if(m.isG){const g=GR[k];if(g&&g.members&&g.members[U]&&mt(g.name))a.push({k,id:k,g:1,o:g,m})}else{const id=k.split('_').find(x=>x!==U)||U,u=usr(id);if(mt(u.name))a.push({k,id,g:0,o:u,m})}}
a.sort((x,y)=>PIN.has(y.k)-PIN.has(x.k)||y.m.ts-x.m.ts);h=a.map(row).join('')||'<div class=emp>Пока нет диалогов.<br>Откройте вкладку «Люди», чтобы начать</div>'}
else if(TAB===1){h='<div class=row onclick="grpSheet()"><div class=av style="width:46px;height:46px;background:var(--ac);font-size:24px">＋</div><div class=rm><div class=r1><b>Новая команда</b></div></div></div>'+Object.values(GR).filter(g=>g.members&&g.members[U]&&mt(g.name)).sort((x,y)=>((MY[y.id]||{}).ts||0)-((MY[x.id]||{}).ts||0)).map(g=>row({k:g.id,id:g.id,g:1,o:g,m:MY[g.id]||null})).join('')}
else h=Object.values(USERS).filter(u=>u.id!==U&&mt(u.name)).map(u=>row({id:u.id,g:0,o:u,m:null})).join('')||'<div class=emp>Никого не найдено</div>';
$('#list').innerHTML=h}
function tab(i){TAB=i;document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));$('.tabs i').style.transform=`translateX(${i*100}%)`;const L=$('#list');L.classList.remove('fx');void L.offsetWidth;L.classList.add('fx');drawList()}
let sq,lpT,lpF;const L=$('#list');
$('#q').oninput=()=>{clearTimeout(sq);sq=setTimeout(drawList,150)};
L.addEventListener('click',e=>{if(lpF){lpF=0;return}const r=e.target.closest('.row');if(r&&r.dataset.id)openChat(r.dataset.id,r.dataset.g==='1')});
L.addEventListener('touchstart',e=>{const r=e.target.closest('.row');if(!r||!r.dataset.k)return;lpF=0;lpT=setTimeout(()=>{lpF=1;navigator.vibrate&&navigator.vibrate(15);rowMenu(r.dataset.k)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(t=>L.addEventListener(t,()=>clearTimeout(lpT),{passive:true}));
L.addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(r&&r.dataset.k){e.preventDefault();rowMenu(r.dataset.k)}});
function rowMenu(k){const p=PIN.has(k);sheet(`<button class=it onclick="pin('${k}')">📌 ${p?'Открепить':'Закрепить'}</button><button class="it dg" onclick="delChat('${k}')">🗑 Удалить переписку</button>`)}
function pin(k){PIN.has(k)?PIN.delete(k):PIN.add(k);localStorage.pin=JSON.stringify([...PIN]);closeSheet();drawList()}
function delChat(k){closeSheet();if(CH&&CH.key===k)closeChat();db.ref(`user_chats/${U}/${k}`).remove()}

/* ---------- чат ---------- */
function openChat(id,g){g=g?1:0;unlisten();stopRec(0);const key=g?id:ck(U,id);CH={id,g,key,ready:0};MSG={};EL={};RX={};
const f=$('#msgs');f.innerHTML='';f.dataset.s=1;$('#chat').classList.add('on');$('#app').classList.add('open');clearRP();ATT=null;showAtt();$('#inp').value='';actUI();chatHead();drawList();
const r=db.ref('messages/'+key).limitToLast(60);
on(r,'child_added',s=>addMsg(s.key,s.val()));on(r,'child_changed',s=>addMsg(s.key,s.val()));
on(r,'child_removed',s=>{delete MSG[s.key];EL[s.key]&&EL[s.key].remove();delete EL[s.key]});
r.once('value',()=>{if(CH&&CH.key===key){CH.ready=1;toBottom();markRead()}});
on(db.ref('reactions/'+key),'value',s=>{RX=s.val()||{};paintRx()});
on(db.ref('typing/'+key),'value',s=>{if(!CH)return;CH.typing=Object.keys(s.val()||{}).some(x=>x!==U);chatHead()});
markRead()}
function closeChat(){stopRec(0);unlisten();CH=null;EL={};$('#app').classList.remove('open');setTimeout(()=>{if(!CH)$('#chat').classList.remove('on')},450);drawList()}
function chatHead(){if(!CH)return;const g=CH.g,o=g?GR[CH.id]:usr(CH.id);if(!o)return closeChat();
$('#cav').innerHTML=av(o,42);$('#cn').innerHTML=esc(o.name)+(g?'':vb(CH.id));$('#cs').textContent=CH.typing?'печатает…':g?Object.keys(o.members||{}).length+' участников':stt(o);$('#cs').style.color=CH.typing||(!g&&o.status==='в сети')?'var(--ac)':'';
$('#ca').innerHTML=g?`<button class=ib onclick="grpSheet('${CH.id}')">⚙︎</button>`:''}
function viewProf(){if(!CH)return;const g=CH.g,o=g?GR[CH.id]:usr(CH.id);sheet(`<div style="display:grid;place-items:center;gap:10px;text-align:center">${av(o,110)}<b style="font-size:24px">${esc(o.name)}${g?'':vb(CH.id)}</b><div style="color:var(--t2)">${esc(g?Object.keys(o.members||{}).length+' участников':o.description||'')}</div><div style="color:var(--t2)">${esc(g?'':o.statusText||stt(o))}</div></div>`)}
function markRead(){if(!CH||document.hidden)return;db.ref(`user_chats/${U}/${CH.key}/unread`).remove();if(CH.g)return;const u={};for(const k in MSG)if(MSG[k].uid!==U&&MSG[k].status!=='read')u[`messages/${CH.key}/${k}/status`]=MSG[k].status='read';if(MY[CH.key]&&MY[CH.key].senderUid===CH.id)u[`user_chats/${CH.id}/${CH.key}/msgStatus`]='read';if(Object.keys(u).length)db.ref().update(u)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)markRead()});
function addMsg(k,m){MSG[k]=m;const e=mkMsg(k,m),old=EL[k],f=$('#msgs');
if(old)old.replaceWith(e);else{const near=f.dataset.s!=='0';if(CH.ready)e.classList.add('nw');f.append(e);if(!CH.ready||near||m.uid===U)toBottom(CH.ready)}
EL[k]=e;paintRx(k);if(CH.ready&&m.uid!==U)markRead()}
$('#msgs').onscroll=function(){this.dataset.s=this.scrollHeight-this.scrollTop-this.clientHeight<120?1:0};
function mkMsg(k,m){const mine=m.uid===U,d=document.createElement('div');d.className='m '+(mine?'o':'i');let h='<div class=b>';
if(CH.g&&!mine)h+=`<div class=un>${esc(m.uname)}</div>`;
if(m.replyTo)h+=`<div class=rp><b>${esc(m.runame||'Ответ')}</b>${esc(String(m.rtext||'Вложение').slice(0,80))}</div>`;
h+='<div class=bd></div>';if(m.text)h+=`<div>${fmt(m.text)}</div>`;
h+=`<div class=mt>${esc(m.time||tm(m.ts))}${mine&&!CH.g?' '+tk(m.status):''}</div></div><div class=rx></div>`;d.innerHTML=h;
const f=m.file,bd=d.querySelector('.bd');
if(typeof f==='string'){
if(f.startsWith('data:image/')){const i=new Image;i.src=f;i.onclick=e=>{e.stopPropagation();$('#lb img').src=f;$('#lb').classList.add('on')};i.onload=stick;bd.append(i)}
else if(f.startsWith('data:audio/')){const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=f;a.onclick=e=>e.stopPropagation();bd.append(a)}
else if(f.startsWith('data:')){const a=document.createElement('a');a.className='fl';a.href=f;a.download=m.fname||'file';a.textContent='📎 '+(m.fname||'Файл');a.onclick=e=>e.stopPropagation();bd.append(a)}}
if(!bd.firstChild)bd.remove();d.querySelector('.b').onclick=()=>msgMenu(k);return d}
function paintRx(k){(k?[k]:Object.keys(EL)).forEach(x=>{const e=EL[x];if(!e)return;const r=RX[x]||{},c={};for(const u in r)if(EM[r[u]])c[r[u]]=(c[r[u]]||0)+1;
e.querySelector('.rx').innerHTML=Object.entries(c).map(([n,v])=>`<button class="${r[U]===n?'me':''}" onclick="react('${x}','${n}')">${EM[n]} ${v}</button>`).join('')})}
function msgMenu(k){const m=MSG[k];if(!m)return;sheet(`<div class=emo>${Object.entries(EM).map(([n,e])=>`<button onclick="react('${k}','${n}')">${e}</button>`).join('')}</div><button class=it onclick="reply('${k}')">↩ Ответить</button>${m.uid===U?`<button class="it dg" onclick="delMsg('${k}')">🗑 Удалить</button>`:''}`)}
function react(k,n){closeSheet();const r=db.ref(`reactions/${CH.key}/${k}/${U}`);(RX[k]||{})[U]===n?r.remove():r.set(n)}
function delMsg(k){closeSheet();db.ref(`messages/${CH.key}/${k}`).remove()}
function reply(k){closeSheet();const m=MSG[k];RP={k,t:m.text||'Вложение',n:m.uname};$('#rpb').innerHTML=`<div style="flex:1;min-width:0;border-left:3px solid var(--ac);padding-left:8px"><b style="color:var(--ac)">${esc(m.uname)}</b><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)">${esc(RP.t)}</div></div><button onclick=clearRP()>✕</button>`;$('#rpb').classList.add('on');$('#inp').focus()}
function clearRP(){RP=null;$('#rpb').classList.remove('on')}

/* ---------- отправка ---------- */
function send(){const inp=$('#inp'),txt=inp.value.trim();if(!CH||(!txt&&!ATT))return;
const ts=Date.now(),p={uid:U,uname:me().name,text:txt,ts,time:tm(ts),status:'sent'};
if(ATT){p.file=ATT.data;p.fname=ATT.name;ATT=null;showAtt()}
if(RP){p.replyTo=RP.k;p.rtext=RP.t;p.runame=RP.n;clearRP()}
inp.value='';actUI();const {key,g,id}=CH;
db.ref('messages/'+key).push(p).catch(()=>toast('Не удалось отправить'));
const f=p.file||'',last=(txt||(f.startsWith('data:audio')?'🎤 Голосовое':f.startsWith('data:image')?'🖼 Фото':'📎 '+(p.fname||'Файл'))).slice(0,120);
const b={lastMsg:last,ts,time:p.time,isG:!!g,senderUid:U,senderName:p.uname,msgStatus:'sent'},up={};
(g?Object.keys((GR[id]||{}).members||{}):[U,id]).forEach(t=>{for(const x in b)up[`user_chats/${t}/${key}/${x}`]=b[x];if(t!==U)up[`user_chats/${t}/${key}/unread`]=SV.increment(1)});
db.ref().update(up);db.ref(`typing/${key}/${U}`).remove()}
$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
let tt,tl=0;$('#inp').addEventListener('input',()=>{actUI();if(!CH)return;const n=Date.now(),key=CH.key;if(n-tl>1500){tl=n;db.ref(`typing/${key}/${U}`).set(true)}clearTimeout(tt);tt=setTimeout(()=>{db.ref(`typing/${key}/${U}`).remove();tl=0},2000)});
function actUI(){const a=$('#act'),has=$('#inp').value.trim()||ATT;a.className=rec?'rc':has?'go':'';a.innerHTML=rec?'■':has?SEND:MIC;$('#clip').textContent=rec?'✕':'📎'}
$('#act').onclick=()=>rec?stopRec(1):($('#inp').value.trim()||ATT)?send():startRec();
function clipBtn(){rec?stopRec(0):sheet(`<div class=gr><button onclick="closeSheet();pick('image/*')"><span>🖼</span>Фото</button><button onclick="closeSheet();pick('image/*',1)"><span>📷</span>Камера</button><button onclick="closeSheet();pick('*/*')"><span>📄</span>Файл</button></div>`)}
function pick(a,c,fn){const f=$('#fi');FN=fn||onAttach;f.accept=a;c?f.setAttribute('capture','environment'):f.removeAttribute('capture');f.value='';f.click()}
$('#fi').onchange=e=>{const f=e.target.files[0];if(f&&FN)FN(f)};
async function onAttach(f){try{let d;if(f.type.startsWith('image/'))d=await shrink(f,1280);else{if(f.size>7e5)return toast('Файл больше 700 КБ');d=await new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}ATT={data:d,name:f.name};showAtt()}catch{toast('Не удалось прочитать файл')}}
function showAtt(){const a=$('#ap');if(!ATT){a.classList.remove('on');a.innerHTML='';return actUI()}a.innerHTML=(ATT.data.startsWith('data:image/')?'<img style="height:44px;border-radius:8px">':'<span>📎</span>')+`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ATT.name)}</span><button onclick="ATT=null;showAtt()">✕</button>`;const i=a.querySelector('img');if(i)i.src=ATT.data;a.classList.add('on');actUI()}
async function startRec(){if(!CH)return;try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec={mr,go:1,t:Date.now()};rec.iv=setInterval(()=>{const s=(Date.now()-rec.t)/1e3|0;$('#inp').placeholder='● '+(s/60|0)+':'+String(s%60).padStart(2,'0');if(s>=120)stopRec(1)},300);
mr.onstop=()=>{const r=rec;clearInterval(r.iv);st.getTracks().forEach(t=>t.stop());rec=null;$('#inp').placeholder='Сообщение';$('#inp').disabled=false;actUI();if(!r.go||!ch.length)return;const x=new FileReader;x.onload=()=>{ATT={data:x.result,name:'Голосовое'};send()};x.readAsDataURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}))};
mr.start();$('#inp').disabled=true;actUI()}catch{toast('Нет доступа к микрофону')}}
function stopRec(go){if(rec){rec.go=go;rec.mr.stop()}}

/* ---------- команды, профиль, настройки ---------- */
function grpSheet(id){const g=id?GR[id]:null,sel=new Set(g?Object.keys(g.members||{}):[]);
sheet(`<h3>${g?'Команда':'Новая команда'}</h3><input id=gn class=in placeholder="Название" value="${esc(g?g.name:'')}"><div class=mem>${Object.values(USERS).filter(u=>u.id!==U).map(u=>`<label class=mi>${av(u,36)}<span>${esc(u.name)}</span><input type=checkbox value="${u.id}"${sel.has(u.id)?' checked':''}></label>`).join('')||'<div class=emp>Нет других пользователей</div>'}</div><button class=pb onclick="saveGrp('${id||''}')">Сохранить</button>${g&&g.creator===U?`<button class="pb dg" onclick="delGrp('${id}')">Удалить команду</button>`:''}`)}
function saveGrp(id){const n=$('#gn').value.trim();if(!n)return toast('Введите название');const m={[U]:true};document.querySelectorAll('.mem input:checked').forEach(c=>m[c.value]=true);
if(id){db.ref('groups/'+id).update({name:n,members:m});closeSheet();return}
const r=db.ref('groups').push(),ts=Date.now(),up={};r.set({id:r.key,name:n,creator:U,members:m}).then(()=>{Object.keys(m).forEach(t=>up[`user_chats/${t}/${r.key}`]={lastMsg:'Команда создана',ts,time:tm(ts),isG:true,senderUid:'system'});db.ref().update(up);closeSheet();openChat(r.key,1)})}
function delGrp(id){closeSheet();if(CH&&CH.id===id)closeChat();const g=GR[id]||{},up={};Object.keys(g.members||{}).forEach(t=>up[`user_chats/${t}/${id}`]=null);up['groups/'+id]=null;up['messages/'+id]=null;db.ref().update(up)}
function profSheet(){const u=me();tmpImg=u.img||'';sheet(`<h3>Профиль</h3><div style="display:grid;place-items:center;gap:8px;margin-bottom:16px"><div id=pav>${av(u,84)}</div><button style="color:var(--ac)" onclick="pick('image/*',0,pf)">Изменить фото</button></div><input id=pn class=in placeholder="Имя" value="${esc(u.name)}"><input id=pd class=in placeholder="О себе" value="${esc(u.description)}"><input id=ps class=in placeholder="Статус" value="${esc(u.statusText)}"><button class=pb onclick=saveProf()>Сохранить</button>`)}
async function pf(f){try{tmpImg=await shrink(f,256,.8);$('#pav').innerHTML=av({...me(),img:tmpImg},84)}catch{toast('Не удалось загрузить фото')}}
function saveProf(){const n=$('#pn').value.trim();if(!n)return toast('Введите имя');db.ref('users/'+U).update({name:n,description:$('#pd').value.trim(),statusText:$('#ps').value.trim(),img:tmpImg}).then(closeSheet)}
function setSheet(){const c=localStorage.t||'default';sheet(`<h3>Настройки</h3><div class=sw>${[['default','#0a7aff'],['ocean','#0077b6'],['forest','#26a65b'],['sunset','#ff6b35'],['violet','#a24ee0'],['dark','#1c1c1e']].map(([n,k])=>`<button class="${c===n?'on':''}" style="background:${k}" onclick="th('${n}',this)"></button>`).join('')}</div><div class=sr2>Звук уведомлений<button class="tg${SND?' on':''}" onclick="this.classList.toggle('on');SND=!SND;localStorage.snd=+SND"></button></div><div class=sr2>Системные уведомления<button class="tg${window.Notification&&Notification.permission==='granted'?' on':''}" onclick="askN(this)"></button></div><button class="pb sc" onclick=profSheet()>Профиль</button><button class="pb dg" onclick=logout()>Выйти</button><p style="text-align:center;color:var(--t2);font-size:12px;margin-top:14px">Connecta 2.0</p>`)}
function askN(b){window.Notification?Notification.requestPermission().then(p=>b.classList.toggle('on',p==='granted')):toast('Не поддерживается')}

/* ---------- истории ---------- */
const stl=u=>Object.values(ST[u]||{}).filter(s=>s&&s.time>Date.now()-DAY&&typeof s.image==='string').sort((a,b)=>a.time-b.time);
function drawStories(){const mine=stl(U);let h=`<div class=st onclick="${mine.length?`openSt('${U}')`:'addSt()'}"><div class="ring${mine.length?'':' m'}">${av(me(),56)}</div><i class=plus onclick="event.stopPropagation();addSt()">+</i><span>Моя</span></div>`;
Object.keys(ST).filter(u=>u!==U&&stl(u).length).sort((a,b)=>stl(b).slice(-1)[0].time-stl(a).slice(-1)[0].time).forEach(u=>{const seen=stl(u).every(s=>s.viewedBy&&s.viewedBy[U]);h+=`<div class=st onclick="openSt('${u}')"><div class="ring${seen?' v':''}">${av(usr(u),56)}</div><span>${esc(usr(u).name)}</span></div>`});
$('#stories').innerHTML=h}
function addSt(){pick('image/*',0,async f=>{try{const d=await shrink(f,1080,.7),id='s'+Date.now();await db.ref(`stories/${U}/${id}`).set({id,image:d,time:Date.now(),authorId:U,authorName:me().name});toast('История опубликована')}catch{toast('Не удалось опубликовать')}})}
function openSt(u){const l=stl(u);if(!l.length)return;SVS={u,l,i:0};$('#sv').classList.add('on');showSt()}
function showSt(){const {u,l,i}=SVS,s=l[i],o=usr(u);
$('#sv').innerHTML=`<div class=pgs>${l.map((_,j)=>`<u class="${j<i?'d':j===i?'a':''}"></u>`).join('')}</div><div class=sh2>${av(o,38)}<b>${esc(o.name)}</b><span>${tm(s.time)}</span>${u===U?'<button class=ib onclick=delSt()>🗑</button>':''}<button class=ib onclick=closeSt()>✕</button></div><img alt=""><div class="z l" onclick="stGo(-1)"></div><div class="z r" onclick="stGo(1)"></div>`;
if(s.image.startsWith('data:image/'))$('#sv img').src=s.image;$('#sv .a').onanimationend=()=>stGo(1);
if(u!==U&&!(s.viewedBy&&s.viewedBy[U]))db.ref(`stories/${u}/${s.id}/viewedBy/${U}`).set(true)}
function stGo(d){if(!SVS)return;SVS.i=Math.max(0,SVS.i+d);if(SVS.i>=SVS.l.length)return closeSt();showSt()}
function closeSt(){SVS=null;$('#sv').classList.remove('on');$('#sv').innerHTML=''}
function delSt(){const s=SVS.l[SVS.i];db.ref(`stories/${U}/${s.id}`).remove();closeSt()}

/* ---------- жесты и запуск ---------- */
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(sx<28&&e.changedTouches[0].clientX-sx>80&&CH&&innerWidth<=800)closeChat()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeSt()}});
actUI();
</script>
</body>
