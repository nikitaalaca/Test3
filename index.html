/* ---------- отправка ---------- */
function send(){const inp=$('#inp'),txt=inp.value.trim();if(!CH||(!txt&&!ATT&&!EXTRA))return;

db.ref('messages/'+key).push(p).catch(()=>toast('Не удалось отправить'));
const f=p.file||'',last=(txt||(p.poll?'📊 '+p.poll.q:f.startsWith('data:audio')?'🎤 Голосовое':f.startsWith('data:image')?'🖼 Фото':'📎 '+(p.fname||'Файл'))).slice(0,120);
const b={lastMsg:last,ts,time:p.time,isG:!!g,senderUid:U,senderName:p.uname,msgStatus:'sent'},up={};
(g?Object.keys((GR[id]||{}).members||{}):[U,id]).forEach(t=>{for(const x in b)up[`user_chats/${t}/${key}/${x}`]=b[x];if(t!==U)up[`user_chats/${t}/${key}/unread`]=SV.increment(1)});
db.ref().update(up);db.ref(`typing/${key}/${U}`).remove()}

let tt,tl=0;$('#inp').addEventListener('input',()=>{actUI();if(!CH)return;const n=Date.now(),key=CH.key;if(n-tl>1500){tl=n;db.ref(`typing/${key}/${U}`).set(true)}clearTimeout(tt);tt=setTimeout(()=>{db.ref(`typing/${key}/${U}`).remove();tl=0},2000)});

$('#act').onclick=()=>rec?stopRec(1):($('#inp').value.trim()||ATT)?send():startRec();
function clipBtn(){rec?stopRec(0):sheet(`<div class=gr><button onclick="closeSheet();pick('image/*')"><span>🖼</span>Фото</button><button onclick="closeSheet();pick('image/*',1)"><span>📷</span>Камера</button><button onclick="closeSheet();pick('*/*')"><span>📄</span>Файл</button><button onclick="pollSheet()"><span>📊</span>Опрос</button><button onclick="shareLoc()"><span>📍</span>Геопозиция</button></div>`)}

rec={mr,go:1,t:Date.now()};rec.iv=setInterval(()=>{const s=(Date.now()-rec.t)/1e3|0;$('#inp').placeholder='● '+(s/60|0)+':'+String(s%60).padStart(2,'0');if(s>=120)stopRec(1)},300);
mr.onstop=()=>{const r=rec;clearInterval(r.iv);st.getTracks().forEach(t=>t.stop());rec=null;$('#inp').placeholder='Сообщение';$('#inp').disabled=false;actUI();if(!r.go||!ch.length)return;const x=new FileReader;x.onload=()=>{ATT={data:x.result,name:'Голосовое'};send()};x.readAsDataURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}))};

/* --- Утилиты --- */
function compress(f,max,q){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(f)})}
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const safeImg=s=>/^data:image\/(png|jpe?g|webp|gif);base64,/.test(s||'')?s:'';
function linkify(h){return h.replace(/(https?:\/\/[^\s<"]+)/g,'<a href="$1" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:inherit;text-decoration:underline">$1</a>')}
function ago(t){const s=(Date.now()-t)/1e3;return s<60?'сейчас':s<3600?Math.floor(s/60)+' мин':s<86400?Math.floor(s/3600)+' ч':Math.floor(s/86400)+' дн'}
function pruneStories(o){const lim=Date.now()-864e5,r={};for(const u in o){const v=o[u];if(!v||typeof v!=='object')continue;const m={};for(const k in v){const s=v[k];if(s&&s.time>lim)m[k]=s;else if(u===currentUserId)db.ref(`stories/${u}/${k}`).remove()}if(Object.keys(m).length)r[u]=m}return r}
function markRead(){if(!activeChatRealKey||document.hidden)return;const u={};for(const k in currentChatMessages){const m=currentChatMessages[k];if(m.uid!==currentUserId&&m.status!=='read')u[k+'/status']='read'}if(Object.keys(u).length)db.ref('messages/'+activeChatRealKey).update(u);if(!isGroupMode){const o=activeChatId;db.ref(`user_chats/${o}/${activeChatRealKey}`).transaction(n=>{if(n&&n.senderUid===o)n.msgStatus='read';return n})}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)markRead()});

window.handleFileSelect=async function(e){const f=e.target.files[0];if(!f)return;if(f.size>2e7){showInAppToast('Ошибка','Файл слишком большой');e.target.value='';return}try{attachFile=/^image\/(png|jpe?g|webp)$/.test(f.type)?await compress(f,1280,.82):await readURL(f)}catch(x){showInAppToast('Ошибка','Не удалось прочитать файл');return}attachName=f.name;const p=E('attach-preview');p.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 20px';p.innerHTML=`<div style="display:flex;gap:8px;align-items:center;min-width:0;flex:1"><span>📎</span><span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(f.name)}</span></div><button style="border:none;background:none;color:var(--danger);cursor:pointer;padding:4px 8px;font-size:14px" onclick="clearAttach()">Удалить</button>`;e.target.value=''};

window.handleGroupImgUpload=async function(e){const f=e.target.files[0];if(!f)return;try{tempGroupImg=await compress(f,256,.85)}catch(x){showInAppToast('Ошибка','Не удалось прочитать фото');return}E('edit-group-avatar-preview').innerHTML=`<div class="avatar-ui" style="background-image:url('${tempGroupImg}');width:64px;height:64px"></div>`};
window.createPoll=function(){const q=E('poll-question').value.trim(),o=[...document.querySelectorAll('.poll-option-input')].map(i=>i.value.trim()).filter(Boolean).map(t=>({text:t,votes:0}));if(!q||o.length<2){showInAppToast('Ошибка','Нужен вопрос и минимум 2 варианта');return}pendingPoll={question:q,options:o,totalVotes:0};E('poll-question').value='';document.querySelectorAll('.poll-option-input').forEach(i=>i.value='');closeModals();sendMessage()};

/* --- Нижние панели: комментарии, новая публикация --- */
function sheet(h){closeSheet();const o=document.createElement('div');o.className='v2-sheet';o.id='v2-sheet';o.onclick=e=>{if(e.target===o)closeSheet()};o.innerHTML=`<div class="sh">${h}</div>`;document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('on'))}

function postEl(id,p){const u=allUsers.find(x=>x.id===p.uid)||{id:p.uid,name:p.uname||'Пользователь'},k=sid(id),d=document.createElement('article');d.className='post';d.dataset.pid=id;d.dataset.uid=p.uid;d.dataset.ts=p.ts;d.innerHTML=`<div class="ph"><div onclick="openProfile('${sid(p.uid)}')" style="cursor:pointer">${getAvatar(u,34)}</div><div class="pn" onclick="openProfile('${sid(p.uid)}')">${escapeHTML(u.name)}${isVerified(p.uid)?getVerifiedIcon():''}<small>${ago(p.ts)}</small></div>${p.uid===currentUserId?`<button class="pb" onclick="delPost('${k}')">Удалить</button>`:''}</div><div class="pi" ondblclick="likePost('${k}',1,this)"><img src="${safeImg(p.img)}" alt=""></div><div class="pa"><button class="lk" onclick="likePost('${k}')"></button><button onclick="openComments('${k}')">${I.cmt}</button></div><div class="pl"></div>${p.text?`<div class="pt"><b>${escapeHTML(u.name)}</b> ${linkify(escapeHTML(p.text))}</div>`:''}<div class="pc" onclick="openComments('${k}')"></div>`;return d}
function updPost(id){const p=posts[id];if(!p)return;const n=p.likes?Object.keys(p.likes).length:0,on=!!(p.likes&&p.likes[currentUserId]);document.querySelectorAll(`.post[data-pid="${id}"]`).forEach(d=>{d.querySelector('.lk').innerHTML=on?I.liked:I.like;d.querySelector('.pl').textContent=n?`Нравится: ${n}`:'';d.querySelector('.pc').textContent=p.cc?`Все комментарии (${p.cc})`:'Добавить комментарий…'})}

function openProfile(uid){uid=sid(uid);if(!uid)return;closeSheet();v2Page=uid;E('v2-profile').classList.add('on');E('v2-profile').scrollTop=0;profileDraw()}
function toggleFollow(uid){db.ref(`follows/${currentUserId}/${uid}`).set(follows[currentUserId]&&follows[currentUserId][uid]?null:true)}
function profileDraw(){const uid=v2Page,box=E('pf-body');if(!uid||!box)return;pfSig=pfSigOf(uid);const u=allUsers.find(x=>x.id===uid)||{id:uid,name:'Пользователь',color:'#999'},mine=uid===currentUserId,my=Object.entries(posts).filter(([k,p])=>p.uid===uid&&p.img).sort((a,b)=>b[1].ts-a[1].ts),fl=Object.values(follows).filter(f=>f&&f[uid]).length,fg=follows[uid]?Object.keys(follows[uid]).length:0,isF=!!(follows[currentUserId]&&follows[currentUserId][uid]),hs=stories[uid]&&Object.keys(stories[uid]).length;E('pf-title').textContent=u.name;box.innerHTML=`<div class="pf-top"><div class="pf-av${hs?' ring':''}" ${hs?`onclick="viewUserStories('${uid}')"`:''}>${getAvatar(u,86)}</div><div class="pf-st"><div><b>${my.length}</b><span>публикаций</span></div><div><b>${fl}</b><span>подписчиков</span></div><div><b>${fg}</b><span>подписок</span></div></div></div><div class="pf-nm">${escapeHTML(u.name)}${isVerified(uid)?getVerifiedIcon():''}</div>${u.description?`<div class="pf-ds">${escapeHTML(u.description)}</div>`:''}<div class="pf-ds2">${escapeHTML(u.statusText||getStatusPlainText(u.status))}</div><div class="pf-bt">${mine?`<button onclick="openProfileModal()">Редактировать</button><button onclick="openAppSettings()">Настройки</button>`:`<button class="${isF?'':'pr'}" onclick="toggleFollow('${uid}')">${isF?'Вы подписаны':'Подписаться'}</button><button onclick="goChat('${uid}')">Сообщение</button>`}</div><div class="pf-gr">${my.map(([k,p])=>`<div onclick="openPost('${sid(k)}')"><img src="${safeImg(p.img)}" loading="lazy" alt=""></div>`).join('')||'<div class="sh-e" style="grid-column:1/-1">Публикаций пока нет</div>'}</div>`}

/* --- Обёртки существующих функций --- */
const _ic=window.initCore;window.initCore=function(){['users','groups','stories','.info/connected'].forEach(p=>db.ref(p).off());if(currentUserId)db.ref('user_chats/'+currentUserId).off();db.ref('follows').off();if(feedQ)feedQ.off();posts={};E('feed-list').innerHTML='';_ic();feedStart();if(!window.v2s){window.v2s=1;v2Go('feed')}};
const _uu=window.updateUI;window.updateUI=function(){_uu();v2Badge();if(v2Page&&pfSigOf(v2Page)!==pfSig)profileDraw();const c=myChats[activeChatRealKey];if(c&&c.unread&&!document.hidden)db.ref(`user_chats/${currentUserId}/${activeChatRealKey}/unread`).remove()};
const _rs=window.renderStories;window.renderStories=function(){_rs();const f=E('feed-stories'),b=E('stories-bar');if(f&&b)f.innerHTML=b.innerHTML};
const _ov=window.openViewProfile;window.openViewProfile=function(){if(!isGroupMode&&activeChatId)openProfile(activeChatId);else _ov()};
</script>
</body>
</html>
